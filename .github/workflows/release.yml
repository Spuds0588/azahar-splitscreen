name: beta-release

# Builds the emulator, the one-window viewer and the orchestrator for Linux
# x86_64 and macOS x86_64 (Intel), packs them into a runnable bundle and attaches
# both to a pre-release. Windows is not built: the frame ring is POSIX shared
# memory and the orchestrator uses Unix process control, so a Windows port comes
# before a Windows artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator-linux:
    runs-on: ubuntu-latest
    container:
      # Upstream's build image: Qt 6, SDL2, FFmpeg and the rest of Azahar's
      # dependencies, so the emulator builds the same way here as upstream.
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build azahar and azahar-room
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LTO=OFF \
            -DENABLE_QT_UPDATE_CHECKER=OFF \
            -DENABLE_DISCORD_RPC=OFF
          ninja -C build azahar azahar-room
      - name: Upload the emulator binaries
        uses: actions/upload-artifact@v4
        with:
          name: emulator-linux
          if-no-files-found: error
          path: |
            build/bin/Release/azahar
            build/bin/Release/azahar-room

  app-linux:
    runs-on: ubuntu-24.04
    needs: emulator-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install the viewer and orchestrator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            qt6-base-dev libsdl2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            libssl-dev libxdo-dev file
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the emulator binaries
        uses: actions/download-artifact@v4
        with:
          name: emulator-linux
          path: build/bin/Release
      - name: Build the viewer and the orchestrator
        run: |
          chmod +x build/bin/Release/azahar build/bin/Release/azahar-room
          cmake -S tools/viewer -B tools/viewer/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/viewer/build
          cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Pack the beta bundle
        run: bash packaging/pack.sh linux "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: beta-linux
          if-no-files-found: error
          path: out/*.tar.gz

  app-macos:
    # Intel runner: the beta is x86_64, and building against an arm64 Homebrew Qt
    # while targeting x86_64 would not link. CMAKE_OSX_ARCHITECTURES is the
    # "intel flag" that pins the artifact to x86_64 regardless of the host.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install ninja qt sdl2 spirv-tools
      - name: Build azahar and azahar-room (x86_64)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DENABLE_LTO=OFF \
            -DENABLE_FFMPEG=OFF \
            -DENABLE_QT_UPDATE_CHECKER=OFF \
            -DENABLE_DISCORD_RPC=OFF
          ninja -C build azahar azahar-room
      - name: Build the viewer (x86_64)
        run: |
          cmake -S tools/viewer -B tools/viewer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build tools/viewer/build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build the orchestrator (x86_64)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin
      - name: Pack the beta bundle
        env:
          CARGO_TARGET: src-tauri/target/x86_64-apple-darwin/release
        run: bash packaging/pack.sh macos "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          # The runner is Intel, but the architecture is what ships matters.
          name: beta-macos-x86_64
          if-no-files-found: error
          path: out/*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [app-linux, app-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the bundles
        run: |
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -l dist
      - name: Create the pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: Azahar Splitscreen ${{ github.ref_name }} (beta)
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/*.tar.gz
          body: |
            Early beta of the one-window split-screen app.

            **Download:** pick the bundle for your OS, unpack it, and run `./run.sh`.
            Qt 6 and SDL2 must be installed (Linux: your distro's `qt6-base` and
            `sdl2`; macOS: `brew install qt sdl2`). See `BETA.txt` inside the
            bundle for controls, requirements and the list of known limits.

            - Linux x86_64: `azahar-splitscreen-*-linux-x86_64.tar.gz`
            - macOS Intel (x86_64): `azahar-splitscreen-*-macos-x86_64.tar.gz`
              (Apple Silicon: run it under Rosetta 2)

            No ROMs are included. This build has no Windows artifact: the
            shared-memory frame path is POSIX-only.
