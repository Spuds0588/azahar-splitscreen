[package]
name = "azahar-splitscreen"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for the --start signal handler: Ctrl-C must tear the session down.
libc = "0.2"
